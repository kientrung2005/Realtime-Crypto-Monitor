name: realtime-crypto-monitor

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: crypto-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - crypto_network

  spark-master:
    image: apache/spark:3.4.1
    container_name: crypto-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    working_dir: /opt/spark/work-dir
    networks:
      - crypto_network

  spark-worker:
    image: apache/spark:3.4.1
    container_name: crypto-spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_WEBUI_PORT: 8081
    ports:
      - "8081:8081"
    working_dir: /opt/spark/work-dir
    depends_on:
      - spark-master
    networks:
      - crypto_network

  kafka-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: realtime-crypto-driver:3.4.1
    container_name: crypto-kafka-init
    command:
      - python3
      - -m
      - src.kafka.create_topics
    volumes:
      - ./:/opt/spark/work-dir
    working_dir: /opt/spark/work-dir
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - crypto_network

  binance-producer:
    build:
      context: .
      dockerfile: Dockerfile
    image: realtime-crypto-driver:3.4.1
    container_name: crypto-binance-producer
    command:
      - python3
      - -m
      - src.kafka.binance_producer
    volumes:
      - ./:/opt/spark/work-dir
    working_dir: /opt/spark/work-dir
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - crypto_network

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.6.5
    container_name: crypto-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-crypto_market}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-crypto_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - crypto_network

  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile
    image: realtime-crypto-driver:3.4.1
    container_name: crypto-spark-streaming
    command:
      - spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1
      - --conf
      - spark.jars.ivy=/opt/spark/ivy
      - --master
      - spark://spark-master:7077
      - /opt/spark/work-dir/src/spark/load_to_clickhouse.py
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: spark-streaming
    volumes:
      - ./:/opt/spark/work-dir
      - spark_checkpoints:/opt/spark/checkpoints
      - spark_ivy:/opt/spark/ivy
    working_dir: /opt/spark/work-dir
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crypto_network

volumes:
  kafka_data:
  spark_checkpoints:
  spark_ivy:
  clickhouse_data:

networks:
  crypto_network:
    driver: bridge
