name: realtime-crypto-monitor

x-superset-environment: &superset-environment
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-realtime-crypto-monitor-local-secret-key-change-before-deploy}
  SUPERSET_METADATA_HOST: superset-db
  SUPERSET_METADATA_PORT: 5432
  SUPERSET_METADATA_DATABASE: ${SUPERSET_METADATA_DATABASE:-superset}
  SUPERSET_METADATA_USER: ${SUPERSET_METADATA_USER:-superset}
  SUPERSET_METADATA_PASSWORD: ${SUPERSET_METADATA_PASSWORD:-superset}
  SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
  SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Crypto}
  SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-Admin}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
  SUPERSET_INIT_REVISION: "1"
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_HTTP_PORT: 8123
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-crypto_market}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-crypto_user}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}

services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: crypto-minio
    command:
      - server
      - /data
      - --console-address
      - :9001
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-crypto_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-crypto_minio_password}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - crypto_network

  kafka:
    image: apache/kafka:4.3.1
    container_name: crypto-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - crypto_network

  spark-master:
    image: apache/spark:3.4.1
    container_name: crypto-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    working_dir: /opt/spark/work-dir
    networks:
      - crypto_network

  spark-worker:
    image: apache/spark:3.4.1
    container_name: crypto-spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_WEBUI_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    working_dir: /opt/spark/work-dir
    depends_on:
      - spark-master
    networks:
      - crypto_network

  kafka-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline
    image: realtime-crypto-driver:3.4.1
    pull_policy: never
    container_name: crypto-kafka-init
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        chown -R 185:185 /opt/spark/checkpoints /opt/spark/ivy
        && exec python3 -m src.kafka.create_topics
    volumes:
      - ./:/opt/spark/work-dir
      - spark_checkpoints:/opt/spark/checkpoints
      - spark_ivy:/opt/spark/ivy
    working_dir: /opt/spark/work-dir
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - crypto_network

  minio-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline
    image: realtime-crypto-driver:3.4.1
    pull_policy: never
    container_name: crypto-minio-init
    command:
      - python3
      - /opt/spark/work-dir/scripts/init_minio.py
    volumes:
      - ./:/opt/spark/work-dir
    working_dir: /opt/spark/work-dir
    depends_on:
      minio:
        condition: service_started
    networks:
      - crypto_network

  binance-producer:
    image: realtime-crypto-driver:3.4.1
    pull_policy: never
    container_name: crypto-binance-producer
    command:
      - python3
      - -m
      - src.kafka.binance_producer
    volumes:
      - ./:/opt/spark/work-dir
    working_dir: /opt/spark/work-dir
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - crypto_network

  bybit-producer:
    image: realtime-crypto-driver:3.4.1
    pull_policy: never
    container_name: crypto-bybit-producer
    command:
      - python3
      - -m
      - src.kafka.bybit_producer
    volumes:
      - ./:/opt/spark/work-dir
    working_dir: /opt/spark/work-dir
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - crypto_network

  okx-producer:
    image: realtime-crypto-driver:3.4.1
    pull_policy: never
    container_name: crypto-okx-producer
    command:
      - python3
      - -m
      - src.kafka.okx_producer
    volumes:
      - ./:/opt/spark/work-dir
    working_dir: /opt/spark/work-dir
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - crypto_network

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.6.5
    container_name: crypto-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-crypto_market}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-crypto_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - crypto_network

  spark-streaming:
    image: realtime-crypto-driver:3.4.1
    pull_policy: never
    container_name: crypto-spark-streaming
    command:
      - spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1,org.apache.hadoop:hadoop-aws:3.3.4
      - --conf
      - spark.jars.ivy=/opt/spark/ivy
      - --master
      - spark://spark-master:7077
      - /opt/spark/work-dir/src/spark/load_to_clickhouse.py
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: spark-streaming
    volumes:
      - ./:/opt/spark/work-dir
      - spark_checkpoints:/opt/spark/checkpoints
      - spark_ivy:/opt/spark/ivy
    working_dir: /opt/spark/work-dir
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - crypto_network

  superset-db:
    image: postgres:16-alpine
    container_name: crypto-superset-db
    environment:
      POSTGRES_DB: ${SUPERSET_METADATA_DATABASE:-superset}
      POSTGRES_USER: ${SUPERSET_METADATA_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_METADATA_PASSWORD:-superset}
    volumes:
      - superset_metadata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - crypto_network

  superset-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: superset
    image: realtime-crypto-superset:5.0.0
    pull_policy: never
    container_name: crypto-superset-init
    command:
      - python
      - /app/docker/init_superset.py
    environment: *superset-environment
    depends_on:
      superset-db:
        condition: service_healthy
    networks:
      - crypto_network

  superset:
    image: realtime-crypto-superset:5.0.0
    pull_policy: never
    container_name: crypto-superset
    ports:
      - "8088:8088"
    environment: *superset-environment
    depends_on:
      superset-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - crypto_network

volumes:
  kafka_data:
  spark_checkpoints:
  spark_ivy:
  clickhouse_data:
  superset_metadata:
  minio_data:

networks:
  crypto_network:
    driver: bridge
